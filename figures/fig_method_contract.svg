<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="800" viewBox="0 0 1120 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#60758b"/></marker></defs><rect width="1120" height="800" rx="24" fill="#f8fafc"/><text x="42" y="52" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#273c52">FRAME / CONSUMER-CONDITIONED MEMORY</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#748499">Information retained • addressing recovered • age evaluated at use</text><rect x="42" y="126" width="1020" height="125" rx="15" fill="white" stroke="#c8d6e3"/><rect x="42" y="126" width="5" height="125" rx="2" fill="#277e9d"/><text x="63" y="162" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#277e9d">Consumer contract</text><text x="63" y="198" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Task loss Lc   ·   tolerance εc   ·   spatial requirements gc   ·   preferred layout ℓc</text><text x="63" y="225" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Capacity and action deadline define the feasible set.</text><path d="M552 251 L552 296" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="42" y="298" width="300" height="192" rx="15" fill="white" stroke="#c8d6e3"/><rect x="42" y="298" width="5" height="192" rx="2" fill="#657ba7"/><text x="63" y="334" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#657ba7">Stored record</text><text x="63" y="370" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Payload z</text><text x="63" y="397" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Fidelity e · granularity g</text><text x="63" y="424" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Layout ℓ · transform map m</text><text x="63" y="451" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Capture time tcapture</text><rect x="398" y="298" width="300" height="192" rx="15" fill="white" stroke="#c8d6e3"/><rect x="398" y="298" width="5" height="192" rx="2" fill="#9272b6"/><text x="419" y="334" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#9272b6">Access adapter</text><text x="419" y="370" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Direct read</text><text x="419" y="397" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Inverse materialization</text><text x="419" y="424" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Fused indirect read</text><text x="419" y="451" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Metadata and copies charged</text><rect x="754" y="298" width="308" height="192" rx="15" fill="white" stroke="#c8d6e3"/><rect x="754" y="298" width="5" height="192" rx="2" fill="#398d79"/><text x="775" y="334" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#398d79">Temporal access</text><text x="775" y="370" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Return stored information</text><text x="775" y="397" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Predict from executed actions</text><text x="775" y="424" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Acquire an observation</text><text x="775" y="451" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Record timestamps per field</text><path d="M342 395 L395 395" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M698 395 L751 395" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M907 490 L907 529" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="42" y="530" width="655" height="133" rx="15" fill="white" stroke="#c8d6e3"/><rect x="42" y="530" width="5" height="133" rx="2" fill="#3f7e9c"/><text x="63" y="566" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#3f7e9c">Consumer-conditioned distortion</text><text x="63" y="602" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Evaluate the actual decoded, adapted and aged input.</text><text x="63" y="629" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Dc = E[Lc(consumer(Access(r, a, k, Δ)), target)]</text><rect x="754" y="530" width="308" height="133" rx="15" fill="white" stroke="#c8d6e3"/><rect x="754" y="530" width="5" height="133" rx="2" fill="#b0894f"/><text x="775" y="566" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#b0894f">Action and observation</text><text x="775" y="602" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Execute model-selected action</text><text x="775" y="629" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#273c52">Advance → observe → record</text><path d="M754 592 L700 592" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1062 598 L1083 598 L1083 276 L196 276 L196 294" stroke="#60758b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="42" y="713" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#708499">DECISION RULE</text><text x="42" y="746" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#273c52">Pareto-minimize bytes, latency and energy subject to task and deadline constraint