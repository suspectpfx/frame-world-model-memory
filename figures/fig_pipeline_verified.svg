n, target time and action history.</text><polyline points="924,190 963,190" fill="none" stroke="#536d89" stroke-width="2" marker-end="url(#a)"/><text x="39" y="289" fill="#61758c" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400">Invariant: model-compatible input and field timestamps are preserved; fidelity and granularity are separate factors.</text><rect x="15" y="325" width="1470" height="262" rx="17" fill="#f7f9fc" stroke="#d4deea"/><text x="37" y="360" fill="#326484" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">B</text><text x="83" y="360" fill="#2e425b" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Serve the consumer through equivalent access paths</text><rect x="39" y="396" width="217" height="113" rx="12" fill="#eaf4fb" stroke="#bccbdd"/><text x="55" y="424" fill="#2e425b" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700">Stored payload</text><text x="55" y="450" fill="#2e425b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Layout ℓ + valid map m</text><text x="55" y="473" fill="#2e425b" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400">Consumer request c</text><path d="M220 483l8 -8h18l-8 8z" fill="#dceaf7" stroke="#7395b8"/><path d="M238 483l8 -8v18l-8 8z" fill="#87aaca" stroke="#7395b8"/><rect x="220" y="483" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="220" y="489" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="220" y="495" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="226" y="483" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="226" y="489" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="226" y="495" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="232" y="483" width="6" height="6" rx="0" fill="#b9d6ee" stroke="#7194b7"/><rect x="232" y="489" width="6" height="6" rx